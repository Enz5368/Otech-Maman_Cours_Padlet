name: Tester et déployer sur TrueNAS

on:
  push:
    branches: [main, feature/server-multi-user]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monespaceprof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests et validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres-test:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mep_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mep_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mep_test -d mep_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: word-editor/package-lock.json

      - name: Construire et tester les documents Word dans Chromium
        working-directory: word-editor
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          node smoke.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Installer les dépendances
        run: python -m pip install -e "./backend[test]"

      - name: Vérifier le backend et le contrat UI
        run: |
          ruff check backend/app backend/tests tests scripts
          pytest backend/tests tests
          python scripts/security_check.py
          node tests/padlets-smoke.mjs
          node tests/ui-smoke.mjs

      - name: Vérifier les migrations PostgreSQL
        env:
          MEP_DATABASE_URL: postgresql://mep_test:ci-only-password@127.0.0.1:5432/mep_test
        run: python backend/scripts/migrate.py

      - name: Valider la syntaxe YAML et Compose
        run: |
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/deploy.yml', aliases: true)"
          POSTGRES_PASSWORD=ci-secret docker compose config --quiet

      - name: Construire les images
        env:
          POSTGRES_PASSWORD: ci-secret
        run: docker compose build frontend backend scheduler

  deploy:
    name: Mise à jour de monespaceprof.com
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Installer cloudflared
        run: |
          curl -fsSL --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version

      - name: Configurer la clé SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host truenas-deploy
              HostName $SSH_HOST
              User $SSH_USER
              IdentityFile ~/.ssh/deploy_key
              IdentitiesOnly yes
              BatchMode yes
              ConnectTimeout 20
              ServerAliveInterval 20
              ServerAliveCountMax 6
              StrictHostKeyChecking accept-new
              ProxyCommand cloudflared access ssh --hostname %h --service-token-id "$CF_ACCESS_CLIENT_ID" --service-token-secret "$CF_ACCESS_CLIENT_SECRET"
          EOF
          chmod 600 ~/.ssh/config

      - name: Sauvegarder, déployer et vérifier
        run: |
          # The NAS worker owns the deployment; losing the tunnel must not kill it.
          JOB_DIR="$(ssh truenas-deploy "EXPECTED_COMMIT='${{ github.sha }}' sh -s" <<'REMOTE_START'
            set -eu
            REPO="/mnt/DriveMaison/Database/deploy/apps/Otech-Maman_Cours_Padlet"
            cd "$REPO"
            git fetch --no-tags origin "$EXPECTED_COMMIT"
            JOB_DIR="$(mktemp -d /tmp/mep-deploy.XXXXXXXX)"
            chmod 700 "$JOB_DIR"
            git show "$EXPECTED_COMMIT:scripts/deploy_remote.sh" > "$JOB_DIR/deploy.sh"
            nohup setsid sh -c 'EXPECTED_COMMIT="$1" sh "$2/deploy.sh"; code=$?; printf "%s\n" "$code" > "$2/status"' sh "$EXPECTED_COMMIT" "$JOB_DIR" > "$JOB_DIR/output.log" 2>&1 < /dev/null &
            printf '%s\n' "$JOB_DIR"
          REMOTE_START
          )"
          if ! printf '%s\n' "$JOB_DIR" | grep -Eq '^/tmp/mep-deploy\.[A-Za-z0-9]+$'; then
            echo "Répertoire de suivi du déploiement invalide." >&2
            exit 1
          fi
          for attempt in $(seq 1 100); do
            if STATUS="$(ssh truenas-deploy "if test -f '$JOB_DIR/status'; then cat '$JOB_DIR/status'; else echo running; fi")"; then
              :
            else
              STATUS=reconnect
            fi
            case "$STATUS" in
              0)
                ssh truenas-deploy "tail -n 100 '$JOB_DIR/output.log'" || true
                exit 0
                ;;
              running|reconnect)
                echo "Déploiement NAS en cours (vérification $attempt/100)."
                ;;
              *)
                ssh truenas-deploy "tail -n 250 '$JOB_DIR/output.log'" || true
                echo "Le déploiement NAS a échoué (code $STATUS)." >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          ssh truenas-deploy "tail -n 100 '$JOB_DIR/output.log'" || true
          echo "Le suivi du déploiement a expiré ; consulter le journal NAS avant une nouvelle tentative." >&2
          exit 1
